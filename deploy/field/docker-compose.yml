# 现场发布包用：host 网络，算法只拉本机 8554。不要在开发仓库根直接 compose 本文件。
services:
  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    network_mode: host

  rail-vision:
    image: mccbts-rail-vision:local
    depends_on:
      - mediamtx
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
