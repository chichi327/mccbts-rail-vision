[project]
name = "mccbts-rail-vision"
version = "0.1.0"
description = "铁路视觉算法服务：人车检测、测距、障碍物检测与高度，事件上报"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "algorithms*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
