system:
  gpu_id: 0
  log_level: INFO
  max_e2e_ms: 300
  drop_if_frame_age_ms: 200
  # 耗时埋点。现场保持 false；压测延迟改 true 或环境变量 TIMING_ENABLED=true
  timing:
    enabled: false
    log_every_n: 30
  frame_slot_depth: 2
  warning_distance_m: 2.0
  danger_distance_m: 1.0
  heartbeat_interval_s: 5
  camera_offline_after_ms: 3000
  health:
    host: 0.0.0.0
    port: 8080
  backend:
    events_url: http://backend/api/vision/events
    heartbeat_url: http://backend/api/vision/heartbeat
    token: ''
    post_timeout_ms: 100
    retry_queue_size: 1000
  preview:
    enabled: true
    host: 127.0.0.1
    port: 8081
    max_width: 960
    jpeg_quality: 60
    mediamtx_addr: 127.0.0.1:8889
