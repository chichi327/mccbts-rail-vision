# 现场 6 路：ingest 拉本机 MediaMTX，不要直连海康。
# 用法：备份现有 cameras.yaml 后复制本文件覆盖，并按现场改 calib_dir / 分辨率。
# MediaMTX 的 path 名必须与 id 相同（见 config/mediamtx.yml）。

cameras:
  - id: cam01
    name: 现场-1
    source: rtsp
    rtsp_camera: rtsp://user:pass@192.168.1.64:554/Streaming/Channels/101
    rtsp_main: rtsp://127.0.0.1:8554/cam01
    rtsp_sub: rtsp://127.0.0.1:8554/cam01_sub
    width: 1920
    height: 1080
    target_fps: 10
    calib_dir: config/calib/cam01
