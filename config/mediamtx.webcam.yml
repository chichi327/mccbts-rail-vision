# 本机 USB/内置摄像头：FFmpeg 向 MediaMTX 推流，ingest 仍只拉 8554。
# 与现场的差别只在「谁把画面送进 MediaMTX」，不在 Python 拉流。
# 启动：bash scripts/start.sh --webcam
# 勿与现场 mediamtx.yml（拉海康）同时占用 8554。

logLevel: warn
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 64

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: no
hls: no
webrtc: yes
webrtcAddress: :8889
srt: no

paths:
  cam01:
    source: publisher
