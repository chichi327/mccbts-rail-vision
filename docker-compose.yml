services:
  rail-vision:
    build: .
    image: mccbts-rail-vision:local
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  mediamtx:
    profiles: ["preview"]
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
      - "8889:8889"
    restart: unless-stopped
